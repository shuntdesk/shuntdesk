name: Bug report
description: Something on shuntdesk.com does not work as it should
labels: [bug]
body:
  - type: input
    id: page
    attributes: { label: Page, placeholder: "https://shuntdesk.com/ticket/?a=0x…" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, description: What you did, what you expected, what you saw instead. }
    validations: { required: true }
  - type: input
    id: browser
    attributes: { label: Browser and device, placeholder: "Chrome on Android, Edge on Windows…" }