<!doctype html>
<meta charset="utf-8">
<title>Shuntdesk repo banner</title>
<!-- README banner (2400x900) and social preview (1280x640, ?social). The background is the site's own fork view,
     captured from the live renderer; render with a headless browser at the sizes above. -->
<style>
@font-face { font-family: D; src: url(../../site/assets/fonts/bsd-900.woff2); }
@font-face { font-family: M; src: url(../../site/assets/fonts/jbm-400.woff2); }
@font-face { font-family: M; font-weight: 700; src: url(../../site/assets/fonts/jbm-700.woff2); }
* { margin: 0; box-sizing: border-box; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: #060708; color: #edebe6; }
.bg { position: absolute; inset: -20px; background: url(bg.png) 50% 58% / cover no-repeat; filter: blur(1.5px) brightness(1.15); }
.vig { position: absolute; inset: 0; background: radial-gradient(ellipse 62% 80% at 50% 50%, rgba(6,7,8,.6), rgba(6,7,8,.25) 60%, rgba(6,7,8,.85)); }
.frame { position: absolute; inset: 3.2vh 1.6vw; border: 1.5px solid rgba(237,235,230,.18); clip-path: polygon(28px 0, 100% 0, 100% calc(100% - 28px), calc(100% - 28px) 100%, 0 100%, 0 28px); }
.in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 3.4vh; }
.lock { display: flex; align-items: center; gap: 2.2vw; font: 900 15vh/1 D; letter-spacing: .04em; filter: drop-shadow(0 0 40px rgba(255,255,255,.16)) drop-shadow(0 6px 30px rgba(0,0,0,.9)); }
.lock svg { height: 13vh; width: auto; fill: #edebe6; }
.line { font: 900 6.4vh/1 D; text-transform: uppercase; letter-spacing: .02em; }
.line .o { color: transparent; -webkit-text-stroke: 2px #edebe6; }
.chips { display: flex; gap: 1vw; flex-wrap: wrap; justify-content: center; }
.chips span { font: 700 1.9vh M; letter-spacing: .22em; text-transform: uppercase; padding: 1.2vh 1.2vw; background: rgba(8,9,11,.85); box-shadow: inset 0 0 0 1px rgba(237,235,230,.25); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.chips span.g { color: #2ed3a0; box-shadow: inset 0 0 0 1px rgba(46,211,160,.55); }
.chips span.r { color: #ff4d5e; box-shadow: inset 0 0 0 1px rgba(255,77,94,.5); }
body.social .lock { font-size: 13vh; } body.social .line { font-size: 6vh; }
</style>
<div class="bg"></div><div class="vig"></div><div class="frame"></div>
<div class="in">
  <div class="lock"><svg viewBox="136 56 240 400"><path d="M136 456V297.7L292 173.7V90L326 56H376V214.3L220 338.3V422L186 456Z"/></svg>SHUNTDESK</div>
  <div class="line">A token scanner with <span class="o">something to lose.</span></div>
  <div class="chips"><span>Seven checks</span><span class="g">Clean · long desk</span><span>Risky · depot</span><span class="r">Danger · short desk</span><span>Robinhood Chain</span><span>For agents</span></div>
</div>
<script>if (/social/.test(location.search)) document.body.classList.add('social');</script>
